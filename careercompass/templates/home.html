<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>Career Compass - Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #1d3557, #457b9d, #a8dadc, #e63946);
            background-size: 300% 300%;
            animation: gradientCycle 12s infinite ease-in-out;
            overflow: hidden;
        }

        @keyframes gradientCycle {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .shape {
            position: absolute;
            top: -10%;
            width: 30px;
            height: 30px;
            opacity: 0.8;
            animation: fall 10s linear infinite, sway 3s ease-in-out infinite;
        }

        .circle {
            border-radius: 50%;
            background: linear-gradient(45deg, #f39c12, #e63946);
        }

        .square {
            background: linear-gradient(45deg, #457b9d, #1d3557);
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #a8dadc;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0);
            }
            100% {
                top: 110%;
                transform: translateX(100px);
            }
        }

        @keyframes sway {
            0%, 100% {
                transform: translateX(-20px);
            }
            50% {
                transform: translateX(20px);
            }
        }

        .shape:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            left: 50%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            left: 70%;
            animation-delay: 6s;
        }

        .shape:nth-child(5) {
            left: 90%;
            animation-delay: 8s;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            text-align: center;
            animation: fadeIn 1.5s ease-out;
            position: relative;
            z-index: 1;
            border: 4px solid red;
            animation: blinkBorder 1.5s infinite ease-in-out;
        }

        @keyframes blinkBorder {
            0%, 100% {
                border-color: red;
            }
            50% {
                border-color: transparent;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3em;
            margin: 0;
            color: #f4f4f4;
            transition: color 0.3s ease;
        }

        h1:hover {
            color: red;
        }

        p {
            font-size: 1.2em;
            color: #f4f4f4;
            margin: 10px 0 20px;
            transition: color 0.3s ease;
        }

        p:hover {
            color: red;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .dynamic-button {
            background: linear-gradient(45deg, #e63946, #f39c12);
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .dynamic-button:hover {
            background: linear-gradient(45deg, #d62828, #f77f00);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #f4f4f4;
            opacity: 0.8;
        }

        footer a {
            color: #f39c12;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Dropdown Button Style */
        .dropdown {
            position: absolute;
            top: 20px;
            right: 10%;
            z-index: 2;
        }

        .dropbtn {
            background-color: #e63946; /* Same as button color */
            color: white;
            padding: 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 8px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #d62828; /* Darker red on hover */
        }

    </style>
</head>

<body>
    <!-- Background Shapes -->
    <div class="shape circle"></div>
    <div class="shape square"></div>
    <div class="shape triangle"></div>
    <div class="shape circle"></div>
    <div class="shape square"></div>
    <div class="shape triangle"></div>

    <div class="container">
        <h1>Career Compass</h1>
        <p>Select your Domain.</p>
        <div class="button-container">
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=1&selected_domain=Aerospace'">Aerospace</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=2&selected_domain=Artificial Intelligence'">Artificial Intelligence</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=3&selected_domain=Biomedical'">Biomedical</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=4&selected_domain=Chemical'">Chemical</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=5&selected_domain=Civil'">Civil</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=6&selected_domain=Mechanical'">Mechanical</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=7&selected_domain=Electronics and Communication'">Electronics and Communication</button>
            <button class="dynamic-button" onclick="window.location.href='http://127.0.0.1:5000/switch_dataset?dataset=8&selected_domain=Computer Science'">Computer Science</button>
        </div>

        <!-- Dropdown for 'Basic' -->
        

        <footer>
            Powered by <a href="#">Career Compass</a>
        </footer>

    </div>
    <div class="dropdown">
        <button class="dropbtn">Basic</button>
        <div class="dropdown-content">
            <a href="/Aerospace">Aerospace</a>
            <a href="/Artificial Intelligence">Artificial Intelligence</a>
            <a href="/Biomedical">Biomedical</a>
            <a href="/Chemical">Chemical</a>
            <a href="/Civil">Civil</a>
            <a href="/Mechanical">Mechanical</a>
            <a href="/Electronics and Communication">Electronics and Communication</a>
            <a href="/Computer Science">Computer Science</a>
        </div>
    </div>

</body>

</html>
